# Facecam in the TOP-LEFT corner of the stream.
# Tuned on a real 1920x1080 Kai Cenat VOD (Outlast 2): facecam = 480x264 px at (0, 0).
# Usage: clipper run -c configs/preset_top_left.yaml
# Everything not set here comes from ../config.yaml (your clip count, model, encoder...).
extends: ../config.yaml

layout:
  mode: split
  header_height: 140            # title band
  facecam_height: 620           # 140 + 620 = top ~40% of the 9:16 frame; gameplay gets 1160 px
  facecam:
    preset: top-left
    size: [0.25, 0.245]         # facecam w/h as a fraction of the source frame
    margin: [0.0, 0.0]          # inset from the corner if the cam has a border/offset
  gameplay:
    zoom: 1.08                  # slight zoom-in; with center_y below it trims the top-centre viewer counter
    center_x: 0.5               # centre crop keeps right-side chat/alerts out of frame
    center_y: 0.54
    fit: crop

captions:                       # bold, high-contrast mobile style
  font: Arial Black
  font_size: 92
  primary_color: "#FFFFFF"
  highlight_color: "#FFE600"
  outline_color: "#000000"
  outline: 8
  shadow: 4
  uppercase: true
  max_words: 3
  max_chars: 16
  position: seam                # sits on the facecam/gameplay seam
  pop: true

title:
  font: Arial Black
  font_size: 62
  uppercase: true

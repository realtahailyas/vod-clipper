# xqc (Twitch/Kick) - measured from a 2026-11-18 VOD: cam top-left
# Usage: clipper run VOD -c configs/creators/xqc.yaml [-c configs/games/gta6.yaml]
# Layouts change between games/streams: always check with  clipper preview VOD -c configs/creators/xqc.yaml
extends: ../../config.yaml
layout:
  facecam_height: 700
  facecam:
    preset: custom
    region: [0.0, 0.0, 0.221, 0.313]   # x, y, w, h as fractions of the source frame
publish:
  creator: xQc
  creator_url: https://www.twitch.tv/xqc
